## Prevent the game from collecting analytics and sending them to Innersloth (PC only, needs a restart).
# Setting type: Boolean
# Default value: true
DisableTelemetry = true

## Enable April Fools mode (only client-side). Options: Disabled, Horse, Seeker, Long, LongHorse, Classic
# Setting type: String
# Default value: Disabled
AprilFoolsMode = Disabled

## Show more information when finding a game: host name, lobby code, host platform and lobby age, plus the exact number of lobbies online.
# Setting type: Boolean
# Default value: false
MoreLobbyInfo = true

## Always display the vanilla lobby timer in the bottom left corner (works only as host on official servers). AUnlocker had this off by default; the FAC advertises a lobby timer, so it is on.
# Setting type: Boolean
# Default value: true
AlwaysShowLobbyTimer = true

## Show the task panel (the list of your tasks) during meetings.
# Setting type: Boolean
# Default value: false
ShowTaskPanelInMeetings = true

[UNSAFE]

## UNSAFE: other anti-cheats WILL kick you for this. No character limit in chat.
# Setting type: Boolean
# Default value: false
NoCharacterLimit = false

## UNSAFE: other anti-cheats WILL kick you for this. No 3 s cooldown between chat messages.
# Setting type: Boolean
# Default value: false
NoChatCooldown = false

## UNSAFE: other anti-cheats WILL kick you for this. No limits on game host options (e.g. the number of impostors).
# Setting type: Boolean
# Default value: false
NoOptionsLimits = false

