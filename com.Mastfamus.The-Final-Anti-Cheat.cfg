[10. Performance]

## True = the Performance Core owns the frame rate, vSync and (Android) the lightweight quality settings. False = everything stays vanilla. /toggle fps switches it at runtime.
# Setting type: Boolean
# Default value: true
Enabled = true

## PC frame cap (vSync is switched off). 0 = uncapped. 30 - 1000 = that cap.
# Setting type: Int32
# Default value: 240
PcTargetFps = 250

## Android frame cap. 0 = match the display's refresh rate. If your phone supports 90 / 120 Hz but the game only reports 60, put 90 or 120 here. 30 - 240.
# Setting type: Int32
# Default value: 0
AndroidTargetFps = 90

## Android only: when the phone cannot hold the cap the cap steps down to the next even divisor of the display rate (120 -> 60 -> 40 -> 30) and climbs back when there is headroom. A steady frame rate is smoother and cooler than a fluctuating one.
# Setting type: Boolean
# Default value: true
AdaptiveFps = false

## PC only: frame cap while the game window is not focused (an AFK host does not need 240 fps). 0 = do not change the cap when unfocused.
# Setting type: Int32
# Default value: 30
BackgroundFps = 0

## PC only: keep the game running when the window loses focus, so an alt-tabbed host does not stall (and lose) the lobby.
# Setting type: Boolean
# Default value: true
RunInBackground = false

## Auto = Android only, On = always, Off = never. Switches off shadows, MSAA, anisotropic filtering, soft particles, reflection probes and per-pixel lights (the 2D game does not need them). Restored when the Performance Core is switched off.
# Setting type: String
# Default value: Auto
LightweightQuality = off

## A single frame longer than this many milliseconds is written to the console ([FAC Perf]) with the game state and the slow scopes of that frame. 0 = off. 33 - 1000.
# Setting type: Int32
# Default value: 100
HitchLogMs = 400

